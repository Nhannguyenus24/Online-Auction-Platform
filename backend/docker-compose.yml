version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: auction-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
      MYSQL_USER: auction
      MYSQL_PASSWORD: auction_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - auction-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  redis:
    image: redis:7.2-alpine
    container_name: auction-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - auction-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
      interval: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: auction-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - auction-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      timeout: 20s
      retries: 10
      interval: 10s

  loki:
    image: grafana/loki:3.1.1
    container_name: auction-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - auction-network
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/loki/api/v1/status/buildinfo"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:11.1.3
    container_name: auction-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    ports:
      - "3000:3000"
    depends_on:
      - loki
    networks:
      - auction-network
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  loki_data:
  grafana_data:

networks:
  auction-network:
    driver: bridge
