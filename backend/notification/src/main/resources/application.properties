spring.application.name=notification
# Không cần web server - chỉ RabbitMQ consumer
spring.main.web-application-type=none

# Logging configuration
logging.level.notification=DEBUG
logging.level.com.auction.rabbitmq=DEBUG
logging.level.reactor.rabbitmq=DEBUG

# R2DBC MySQL Configuration (use env vars for credentials)
spring.r2dbc.url=${MYSQL_URL:r2dbc:mysql://localhost:3306/mydb}
# R2dbcMySQLConfig builds its connection factory from host/port/database rather
# than the url above; host and port already default, database does not.
spring.r2dbc.database=${MYSQL_DATABASE:mydb}
spring.r2dbc.username=${MYSQL_USER:root}
spring.r2dbc.password=${MYSQL_PASSWORD:root123}
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

# Email Configuration (SMTP - use env vars for credentials)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@example.com}
spring.mail.password=${MAIL_PASSWORD:your_email_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email From Address
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@auctionplatform.com}
app.mail.from-name=Online Auction Platform

# RabbitMQ Configuration (use env vars for credentials)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.virtual-host=/

# Notification queue (direct queue, no exchange)
rabbitmq.notification.queue=dev

# Logging Loki Configuration
logging.loki.url=http://localhost:3100/loki/api/v1/push

