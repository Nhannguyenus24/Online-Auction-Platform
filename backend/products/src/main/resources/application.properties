spring.application.name=products

# Disable HTTP server (gRPC only service)
spring.main.web-application-type=none

# R2DBC MySQL Configuration (use env vars for credentials)
spring.r2dbc.url=${MYSQL_URL:r2dbc:mysql://localhost:3306/mydb}
spring.r2dbc.username=${MYSQL_USER:root}
spring.r2dbc.password=${MYSQL_PASSWORD:root123}
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

# Retry Configuration for connection failures
spring.r2dbc.retry.max-attempts=3
spring.r2dbc.retry.min-backoff=100ms
spring.r2dbc.retry.max-backoff=3s

# gRPC server port
spring.grpc.server.port=9091

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000

# RabbitMQ Configuration (use env vars for credentials)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.virtual-host=/

# Notification queue (direct queue, no exchange)
rabbitmq.notification.queue=dev

# Logging Loki Configuration
logging.loki.url=http://localhost:3100/loki/api/v1/push