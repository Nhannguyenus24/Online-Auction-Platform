# Development Environment Configuration
spring.profiles.active=dev
server.port=8080

# Logging - More verbose in development
logging.level.root=INFO
logging.level.gateway=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

# Database
spring.r2dbc.url=r2dbc:mysql://localhost:3306/mydb
spring.r2dbc.username=root
spring.r2dbc.password=root123

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# JWT
jwt.secret=dev-secret-key-minimum-32-characters-long-for-testing

# Rate Limiting - More lenient in dev
rate.limit.auth.capacity=1000
rate.limit.public.capacity=500
rate.limit.authenticated.capacity=500

# Actuator - All endpoints exposed in dev
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers

# CORS - Allow all origins in dev
server.cors.allowed-origins=*

# Swagger UI - Enable in dev
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
