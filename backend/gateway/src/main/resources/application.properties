spring.application.name=gateway
server.port=8080

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# Gateway Configuration
gateway.base-url=http://localhost:8080

# gRPC User Service Configuration
grpc.user-service.host=localhost
grpc.user-service.port=9090

# JWT Configuration (must match user service secret for validation)
jwt.secret=your-super-secret-jwt-key-change-this-in-production-min-32-chars

# SpringDoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# Show detailed information in OpenAPI docs
springdoc.show-actuator=false
springdoc.show-login-endpoint=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

