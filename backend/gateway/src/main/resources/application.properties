spring.application.name=gateway
server.port=8080

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Gateway Configuration
gateway.base-url=http://localhost:8080

# gRPC User Service Configuration
grpc.user-service.host=localhost
grpc.user-service.port=9090

# JWT Configuration (must match user service secret for validation)
jwt.secret=your-jwt-secret-key-minimum-32-characters-long

# SpringDoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# Show detailed information in OpenAPI docs
springdoc.show-actuator=false
springdoc.show-login-endpoint=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.loki.url=http://localhost:3100/loki/api/v1/push

# Rate Limiting Configuration
# All endpoints - 10 requests per second
rate.limit.auth.capacity=200
rate.limit.auth.refill.tokens=100
rate.limit.auth.refill.period=1

rate.limit.public.capacity=100
rate.limit.public.refill.tokens=100
rate.limit.public.refill.period=1

rate.limit.authenticated.capacity=100
rate.limit.authenticated.refill.tokens=100
rate.limit.authenticated.refill.period=1

# Rate limit cache configuration
rate.limit.cache.max.size=10000
rate.limit.cache.expire.after.access.minutes=10

# Cloudinary Configuration
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# Stripe Configuration
# Use environment variable STRIPE_SECRET_KEY or default to test key
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_xxxxxxxxxxxxxxxxxxxxxxxx}

# Google oauth2
spring.security.oauth2.client.registration.google.client-id=your_google_client_id.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=your_google_client_secret
spring.security.oauth2.client.registration.google.scope=email,profile

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000