# Production Environment Configuration
spring.profiles.active=prod
server.port=8080

# Logging - Minimal in production
logging.level.root=WARN
logging.level.gateway=INFO
logging.level.org.springframework=WARN

# Database - Use environment variables for credentials
spring.r2dbc.url=${MYSQL_URL}
spring.r2dbc.username=${MYSQL_USER}
spring.r2dbc.password=${MYSQL_PASSWORD}
spring.r2dbc.pool.initial-size=20
spring.r2dbc.pool.max-size=50

# Redis - Use environment variables
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# RabbitMQ - Use environment variables
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}

# Rate Limiting - Stricter in production
rate.limit.auth.capacity=100
rate.limit.public.capacity=50
rate.limit.authenticated.capacity=200

# Actuator - Only essential endpoints
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# CORS - Restrict to specific origins
server.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://example.com}

# Swagger UI - Disable in production
springdoc.swagger-ui.enabled=false

# Security
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
