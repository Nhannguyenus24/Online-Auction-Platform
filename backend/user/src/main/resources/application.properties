spring.application.name=user

# R2DBC MySQL Configuration
spring.r2dbc.url=r2dbc:mysql://localhost:3306/mydb
spring.r2dbc.username=root
spring.r2dbc.password=root123
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

# gRPC server port
grpc.server.port=9090

# JWT Configuration (15 minutes for access, 7 days for refresh)
jwt.secret=your-super-secret-jwt-key-change-this-in-production-min-32-chars
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Application base URL for email verification links
app.base-url=http://localhost:8080
