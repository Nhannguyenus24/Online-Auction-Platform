spring.application.name=user

# Disable HTTP server (gRPC only service)
spring.main.web-application-type=none

# R2DBC MySQL Configuration
spring.r2dbc.url=r2dbc:mysql://localhost:3306/mydb
spring.r2dbc.username=root
spring.r2dbc.password=root123
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

# Retry Configuration for connection failures
spring.r2dbc.retry.max-attempts=3
spring.r2dbc.retry.min-backoff=100ms
spring.r2dbc.retry.max-backoff=3s

# gRPC server port
grpc.server.port=9090

# JWT Configuration (15 minutes for access, 7 days for refresh)
jwt.secret=your-super-secret-jwt-key-change-this-in-production-min-32-chars
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Application base URL for email verification links
app.base-url=http://localhost:8080

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/

# Notification queue (direct queue, no exchange)
rabbitmq.notification.queue=dev