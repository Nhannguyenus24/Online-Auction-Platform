spring.application.name=chat

spring.datasource.url=jdbc:mysql://${CHAT_DB_HOST:localhost}:${CHAT_DB_PORT:3306}/mydb
spring.datasource.username=${CHAT_DB_USER:root}
spring.datasource.password=${CHAT_DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=${CHAT_SERVICE_PORT:8085}

logging.level.chat=INFO
logging.level.org.springframework.web.socket=DEBUG
