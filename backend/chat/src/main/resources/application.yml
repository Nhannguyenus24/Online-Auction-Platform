spring:
  application:
    name: chat
  
  datasource:
    url: jdbc:mysql://${CHAT_DB_HOST:localhost}:${CHAT_DB_PORT:3306}/mydb
    username: ${CHAT_DB_USER:root}
    password: ${CHAT_DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: ${CHAT_SERVICE_PORT:8085}

logging:
  level:
    chat: INFO
    org.springframework.web.socket: DEBUG

