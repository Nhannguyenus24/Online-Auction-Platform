syntax = "proto3";

package com.auction.proto.rating;

option java_multiple_files = true;
option java_package = "com.auction.proto.rating";
option java_outer_classname = "RatingServiceProto";

service RatingService {
    // Add or update user rating (1-5 stars)
    rpc AddUserRating (AddUserRatingRequest) returns (AddUserRatingResponse);
    
    // Delete user rating
    rpc DeleteUserRating (DeleteUserRatingRequest) returns (DeleteUserRatingResponse);
    
    // Get all ratings for a user
    rpc GetUserRatings (GetUserRatingsRequest) returns (GetUserRatingsResponse);
    
    // Get rating statistics for a user
    rpc GetRatingStats (GetRatingStatsRequest) returns (GetRatingStatsResponse);
}

// Add/Update rating request
message AddUserRatingRequest {
    int32 from_user_id = 1; // người đánh giá
    int32 to_user_id = 2; // người được đánh giá
    int32 product_id = 3; // sản phẩm liên quan
    int32 score = 4; // điểm đánh giá (1-5)
    string comment = 5; // bình luận (optional)
}

// Add rating response
message AddUserRatingResponse {
    bool success = 1;
    string message = 2;
    int32 review_id = 3;
}

// Delete rating request
message DeleteUserRatingRequest {
    int32 from_user_id = 1;
    int32 to_user_id = 2;
    int32 product_id = 3;
}

// Delete rating response
message DeleteUserRatingResponse {
    bool success = 1;
    string message = 2;
}

// Get user ratings request
message GetUserRatingsRequest {
    int32 user_id = 1;
    int32 page = 2; // phân trang
    int32 page_size = 3; // số bản ghi/trang
}

// Get user ratings response
message GetUserRatingsResponse {
    int32 user_id = 1;
    int32 total_ratings = 2;
    repeated RatingDetail ratings = 3;
    string message = 4;
}

// Rating statistics request
message GetRatingStatsRequest {
    int32 user_id = 1;
}

// Rating statistics response
message GetRatingStatsResponse {
    int32 user_id = 1;
    int32 total_ratings = 2; // tổng số đánh giá
    double average_score = 3; // điểm trung bình
    int32 five_star = 4; // số 5 sao
    int32 four_star = 5; // số 4 sao
    int32 three_star = 6; // số 3 sao
    int32 two_star = 7; // số 2 sao
    int32 one_star = 8; // số 1 sao
    string message = 9;
}

// Rating detail
message RatingDetail {
    int32 review_id = 1;
    int32 from_user_id = 2;
    string from_user_name = 3;
    int32 product_id = 4;
    string product_title = 5;
    int32 score = 6; // điểm đánh giá (1-5)
    string comment = 7; // bình luận
    int64 created_at = 8;
}