syntax = "proto3";

package product_service;

option java_multiple_files = true;
option java_package = "com.auction.proto.product";
option java_outer_classname = "ProductServiceProto";

service ProductService {
  // Category Management
  rpc GetCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  
  // Product CRUD
  rpc GetProductDetails(GetProductDetailsRequest) returns (GetProductDetailsResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  
  // Product Listing & Search
  rpc GetProducts(GetProductsRequest) returns (GetProductsResponse);
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);
  
  // Category Products
  rpc GetCategoryProducts(GetCategoryProductsRequest) returns (GetCategoryProductsResponse);
  
  // Product Top Lists
  rpc GetTopEndingProducts(GetTopProductsRequest) returns (GetTopProductsResponse);
  rpc GetTopBidCountProducts(GetTopProductsRequest) returns (GetTopProductsResponse);
  rpc GetTopPriceProducts(GetTopProductsRequest) returns (GetTopProductsResponse);
  
  // Product Details
  rpc GetProductHistory(GetProductHistoryRequest) returns (GetProductHistoryResponse);
  rpc GetProductQuestions(GetProductQuestionsRequest) returns (GetProductQuestionsResponse);
  rpc GetRelatedProducts(GetRelatedProductsRequest) returns (GetRelatedProductsResponse);
}

// ==================== Category Messages ====================

message Category {
  int32 id = 1;
  string name = 2;
  int32 parent_id = 3;
  int64 created_at = 4;
  repeated Category children = 5;
}

message GetCategoriesRequest {}

message GetCategoriesResponse {
  repeated Category categories = 1;
}

message CreateCategoryRequest {
  string name = 1;
  int32 parent_id = 2;
}

message CreateCategoryResponse {
  int32 id = 1;
  string name = 2;
  int32 parent_id = 3;
  int64 created_at = 4;
  bool success = 5;
}

message UpdateCategoryRequest {
  int32 id = 1;
  string name = 2;
  int32 parent_id = 3;
}

message UpdateCategoryResponse {
  bool success = 1;
  string message = 2;
}

message DeleteCategoryRequest {
  int32 id = 1;
}

message DeleteCategoryResponse {
  bool success = 1;
  string message = 2;
}

// ==================== Product Messages ====================

message ProductImage {
  int32 id = 1;
  int32 product_id = 2;
  string url = 3;
  int32 sort_order = 4;
  bool is_primary = 5;
  int64 created_at = 6;
}

message Product {
  int32 id = 1;
  int32 seller_id = 2;
  int32 category_id = 3;
  string title = 4;
  string description = 5;
  double starting_price = 6;
  double current_price = 7;
  double step_price = 8;
  double buy_now_price = 9;
  int64 starts_at = 10;
  int64 ends_at = 11;
  bool is_auto_extend = 12;
  int32 auto_extend_seconds = 13;
  string status = 14;
  int32 views_count = 15;
  int32 bids_count = 16;
  int64 created_at = 17;
  int64 updated_at = 18;
  repeated ProductImage images = 19;
  string seller_name = 20;
  string seller_email = 21;
  string highest_bidder_masked = 22;
}

message GetProductDetailsRequest {
  int32 product_id = 1;
}

message GetProductDetailsResponse {
  Product product = 1;
  bool success = 2;
}

message DeleteProductRequest {
  int32 product_id = 1;
}

message DeleteProductResponse {
  bool success = 1;
  string message = 2;
}

// ==================== Product Listing Messages ====================

message PageInfo {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
}

message GetProductsRequest {
  int32 page = 1;
  int32 limit = 2;
  int32 category_id = 3;
  string sort_by = 4; // "price_asc", "price_desc", "newest", "ending_soon"
  string status = 5; // "active", "ended", "all"
}

message GetProductsResponse {
  repeated Product products = 1;
  PageInfo page_info = 2;
  bool success = 3;
}

message SearchProductsRequest {
  string keyword = 1; // Supports Vietnamese diacritics-insensitive search
  int32 page = 2;
  int32 limit = 3;
  int32 category_id = 4;
  string sort_by = 5;
  double min_price = 6;
  double max_price = 7;
}

message SearchProductsResponse {
  repeated Product products = 1;
  PageInfo page_info = 2;
  bool success = 3;
}

// ==================== Category Products Messages ====================

message GetCategoryProductsRequest {
  int32 category_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string sort_by = 4;
}

message GetCategoryProductsResponse {
  repeated Product products = 1;
  PageInfo page_info = 2;
  bool success = 3;
}

// ==================== Top Products Messages ====================

message GetTopProductsRequest {
  int32 limit = 1; // Usually 5
}

message GetTopProductsResponse {
  repeated Product products = 1;
  bool success = 2;
}

// ==================== Product History Messages ====================

message Bid {
  int32 id = 1;
  int32 product_id = 2;
  int32 bidder_id = 3;
  double amount = 4;
  bool is_auto = 5;
  int64 created_at = 6;
  string bidder_masked = 7; // Masked bidder info
}

message GetProductHistoryRequest {
  int32 product_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetProductHistoryResponse {
  repeated Bid bids = 1;
  PageInfo page_info = 2;
  bool success = 3;
}

// ==================== Product Questions Messages ====================

message Question {
  int32 id = 1;
  int32 product_id = 2;
  int32 asker_id = 3;
  string question = 4;
  string answer = 5;
  int32 answered_by = 6;
  int64 created_at = 7;
  int64 answered_at = 8;
  string asker_name = 9;
}

message GetProductQuestionsRequest {
  int32 product_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetProductQuestionsResponse {
  repeated Question questions = 1;
  PageInfo page_info = 2;
  bool success = 3;
}

// ==================== Related Products Messages ====================

message GetRelatedProductsRequest {
  int32 product_id = 1;
  int32 limit = 2; // Usually 5
}

message GetRelatedProductsResponse {
  repeated Product products = 1;
  bool success = 2;
}
